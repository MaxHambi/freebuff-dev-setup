# Dependabot: npm-Updates fuer das Repo-Root (package.json + package-lock.json
# sind die CI-Basis; Bun-Updates laufen bewusst nicht ueber Dependabot, da die
# Runtime im CI-Workflow via oven-sh/setup-bun mit fester Version gepinnt ist).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
